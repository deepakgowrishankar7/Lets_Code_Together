spring.application.name=codetogether

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/mydatabase}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASS:deepak098}

# HikariCP Connection Pool Resilience (Prevents Container Exit on DB Wakeup / Sleep)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.validation-timeout=5000
spring.datasource.hikari.initialization-fail-timeout=-1

spring.jpa.hibernate.ddl-auto=update
server.port=${PORT:8081}
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Prevent Open Session In View (recommended explicitly)
spring.jpa.open-in-view=false

# Email settings (use environment variables or set values here)
mail.provider=${MAIL_PROVIDER:smtp}
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:465}
spring.mail.username=${EMAIL_USER:}
spring.mail.password=${EMAIL_PASS:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.ssl.enable=true
spring.mail.properties.mail.smtp.socketFactory.port=465
spring.mail.properties.mail.smtp.socketFactory.class=javax.net.ssl.SSLSocketFactory
spring.mail.properties.mail.smtp.ssl.trust=${MAIL_SMTP_TRUST:smtp.gmail.com}
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000

# Brevo HTTP Email API (Port 443 Cloud Compatible for ALL Recipients)
brevo.api.key=${BREVO_API_KEY:}
brevo.from=${BREVO_FROM:}

# Resend HTTP Email API (Port 443 Cloud Compatible)
resend.api.key=${RESEND_API_KEY:}
resend.from=${RESEND_FROM:}

# Compiler mode: local uses installed local tools; jdoodle uses JDoodle API
compile.mode=local

# JDoodle compile service credentials
jdoodle.client-id=${JDOODLE_CLIENT_ID:}
jdoodle.client-secret=${JDOODLE_CLIENT_SECRET:}

# Gemini AI Mentor API Configuration
gemini.api.key=${GEMINI_API_KEY:}
gemini.model=${GEMINI_MODEL:gemini-3.6-flash}
gemini.api.url=https://generativelanguage.googleapis.com/v1beta/models/gemini-3.6-flash:generateContent