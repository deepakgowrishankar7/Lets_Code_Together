# Production properties - fill with real secrets via environment variables or external config
server.port=${PORT:8081}
spring.datasource.url=${JDBC_URL:${DB_URL:jdbc:postgresql://localhost:5432/codetogether}}
spring.datasource.username=${JDBC_USERNAME:${DB_USER:}}
spring.datasource.password=${JDBC_PASSWORD:${DB_PASS:}}

# Mail (use real mail service in prod)
mail.provider=${MAIL_PROVIDER:smtp}
spring.mail.host=${MAIL_HOST:smtp.example.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Optional HTTP provider overrides for managed cloud email delivery
brevo.api.key=${BREVO_API_KEY:}
brevo.from=${BREVO_FROM:}
resend.api.key=${RESEND_API_KEY:}
resend.from=${RESEND_FROM:}

# Security
spring.jackson.serialization.FAIL_ON_EMPTY_BEANS=false

# Logging
logging.level.root=INFO

# Aiven SQL uses PostgreSQL
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
