# Production properties - fill with real secrets via environment variables or external config
server.port=8080
spring.datasource.url=${JDBC_URL:jdbc:mysql://localhost:3306/codetogether}
spring.datasource.username=${JDBC_USERNAME:root}
spring.datasource.password=${JDBC_PASSWORD:password}

# Mail (use real mail service in prod)
spring.mail.host=${MAIL_HOST:smtp.example.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Security
spring.jackson.serialization.FAIL_ON_EMPTY_BEANS=false

# Logging
logging.level.root=INFO
