<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Largest Element Visualizer</title>
<style>
:root { --bg:#0b1020; --panel:#12172a; --border:rgba(255,255,255,.08); --text:#e9eeff; --muted:#9aa3c7; --accent:#7c9cff; --accent2:#67e8a8; --danger:#ff7373; --shadow:0 18px 50px rgba(0,0,0,.28); --radius:18px; --mono: ui-monospace,Menlo,Monaco,Consolas,monospace; --sans: Inter,system-ui,sans-serif; }
*{box-sizing:border-box;margin:0;padding:0} body{font-family:var(--mono);background:var(--bg);color:var(--text);padding:20px}
.container{max-width:1200px;margin:0 auto;border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;background:#0f1426;box-shadow:var(--shadow)} .top{display:flex;min-height:520px}
.code-panel{flex:1;padding:18px;border-right:1px solid var(--border);background:linear-gradient(180deg,#161b31,#12162a);overflow:auto}
.debug-panel{width:380px;padding:18px;border-left:1px solid var(--border);background:linear-gradient(180deg,#11162a,#0f1426);display:flex;flex-direction:column;gap:14px}
.output-panel{border-top:1px solid var(--border);padding:14px 18px;background:rgba(255,255,255,.03);min-height:92px}
.panel-title{font-family:var(--sans);font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:12px}
.code-line{font-size:13px;line-height:1.9;color:#d7defc;white-space:pre;padding:0 10px;border-radius:10px}
.code-line.highlight{background:rgba(124,156,255,.16)}
.kw{color:#c792ea}.num{color:#ffcf88}.cls{color:#ffe08a}.fn{color:#8bb6ff}
.step-card,.summary-box,.explain-item{border:1px solid var(--border);border-radius:14px;background:rgba(255,255,255,.03)}
.step-card{padding:14px}.summary-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.summary-box{padding:10px 12px}
.summary-label,.step-progress,.progress-label{font-family:var(--sans);font-size:12px;color:var(--muted)}
.summary-value{font-size:18px;font-weight:800}.summary-value.updated{color:var(--accent)}
.step-badge-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}.step-badge{padding:6px 10px;border-radius:999px;background:rgba(124,156,255,.16);font-family:var(--sans);font-weight:700;font-size:12px}
.step-title{font-family:var(--sans);font-size:18px;font-weight:800;margin-bottom:8px}.step-desc{font-family:var(--sans);font-size:13px;line-height:1.6;color:#d9dfff;margin-bottom:14px}
.progress-bar{height:8px;border-radius:999px;background:rgba(255,255,255,.07);overflow:hidden;margin-bottom:6px}.progress-fill{height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--accent2))}
.explain-list{display:flex;flex-direction:column;gap:8px;margin-top:12px}.explain-item{display:flex;gap:10px;padding:10px 12px;font-family:var(--sans);font-size:13px;line-height:1.5;color:#d9dfff}.explain-mark{width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:rgba(124,156,255,.16);font-weight:800}
.out-line{font-size:13px;line-height:1.8;color:#e9edff}.out-num{color:var(--accent);font-weight:800}
.controls{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:12px 18px;border-top:1px solid var(--border);background:rgba(255,255,255,.03);font-family:var(--sans)}
.btn,select{border:1px solid var(--border);border-radius:12px;background:rgba(255,255,255,.04);color:var(--text);font-size:13px}.btn{padding:9px 16px;cursor:pointer}.btn.primary{background:linear-gradient(135deg,#4f77ff,#7c9cff);border-color:transparent;color:#fff}
.topic-label,.speed-label,.step-info{font-size:12px;color:var(--muted)} .topic-label{margin-left:auto}
@media (max-width:980px){.top{flex-direction:column}.debug-panel{width:100%;border-left:0;border-top:1px solid var(--border)}.code-panel{border-right:0;border-bottom:1px solid var(--border)}.topic-label{margin-left:0;width:100%}}
</style>
</head>
<body>
<div class="container">
  <div class="top">
    <div class="code-panel"><div id="code-lines"></div></div>
    <div class="debug-panel"><div class="panel-title">Debug Window</div><div id="debug-content"></div></div>
  </div>
  <div class="output-panel"><div class="panel-title">Output Window</div><div id="output-lines"></div></div>
  <div class="controls">
    <button class="btn primary" id="playBtn" onclick="togglePlay()">&#9654; Play</button>
    <button class="btn" onclick="resetAnim()">&#8635; Reset</button>
    <span class="speed-label">Speed:</span>
    <select id="speedSel"><option value="1000" selected>1 sec</option><option value="500">0.5 sec</option><option value="100">0.1 sec</option></select>
    <span class="step-info" id="stepInfo">Step 0 / 0</span>
    <span class="topic-label">Java Program — Largest Element</span>
  </div>
</div>
<script>
const codeLines=[
{text:'<span class="kw">public class</span> <span class="cls">LargestElement</span> {',indent:0},
{text:'  <span class="kw">public static void</span> <span class="fn">main</span>(<span class="cls">String</span>[] args) {',indent:0},
{text:'    <span class="kw">int</span>[] a = {12, 45, 1, 99, 23};',indent:0},
{text:'    <span class="kw">int</span> max = a[0];',indent:0},
{text:'    <span class="kw">for</span> (<span class="kw">int</span> i = 1; i &lt; a.length; i++) {',indent:0},
{text:'      <span class="kw">if</span> (a[i] &gt; max) max = a[i];',indent:0},
{text:'    }',indent:0},
{text:'    <span class="cls">System</span>.out.println(max);',indent:0},
{text:'  }',indent:0},
{text:'}',indent:0},
];
const steps=[
{line:2,stage:'Setup',title:'Create array',desc:'The array is initialized with sample values.',debug:{a:'[12,45,1,99,23]',max:'-',i:'-'},exprs:[{mark:'1',text:'Array loaded.'}],output:[]},
{line:3,stage:'Initialize',title:'Set max',desc:'The first element is taken as the initial maximum.',debug:{a:'[12,45,1,99,23]',max:'12',i:'-'},exprs:[{mark:'1',text:'max = 12'}],output:[]},
{line:4,stage:'Loop',title:'Start traversal',desc:'The loop begins from the second element.',debug:{a:'[12,45,1,99,23]',max:'12',i:'1'},exprs:[{mark:'1',text:'i = 1'}],output:[]},
{line:5,stage:'Compare',title:'Check 45',desc:'45 is greater than 12, so max changes.',debug:{a:'[12,45,1,99,23]',max:'45',i:'1'},exprs:[{mark:'1',text:'45 > 12 → true'}],output:[]},
{line:5,stage:'Compare',title:'Check 1',desc:'1 is not greater than 45.',debug:{a:'[12,45,1,99,23]',max:'45',i:'2'},exprs:[{mark:'1',text:'1 > 45 → false'}],output:[]},
{line:5,stage:'Compare',title:'Check 99',desc:'99 becomes the new largest element.',debug:{a:'[12,45,1,99,23]',max:'99',i:'3'},exprs:[{mark:'1',text:'99 > 45 → true'}],output:[]},
{line:5,stage:'Compare',title:'Check 23',desc:'23 does not change the maximum.',debug:{a:'[12,45,1,99,23]',max:'99',i:'4'},exprs:[{mark:'1',text:'23 > 99 → false'}],output:[]},
{line:7,stage:'Output',title:'Print result',desc:'The largest element is printed.',debug:{a:'[12,45,1,99,23]',max:'99',i:'4'},exprs:[{mark:'✓',text:'99'}],output:['99']}
];
let currentStep=0,playing=false,timer=null,prevDebug={};
function renderCode(h){document.getElementById('code-lines').innerHTML=codeLines.map((l,i)=>`<div class="code-line${i===h?' highlight':''}">${l.text}</div>`).join('')}
function renderDebug(s,d){const p=Math.round(((currentStep+1)/steps.length)*100),k=['a','max','i'];document.getElementById('debug-content').innerHTML=`<div class="step-card"><div class="step-badge-row"><div class="step-badge">${s.stage}</div><div class="step-progress">Step ${currentStep+1} / ${steps.length}</div></div><div class="step-title">${s.title}</div><div class="step-desc">${s.desc}</div><div class="progress-bar"><div class="progress-fill" style="width:${p}%"></div></div><div class="progress-label">${p}% complete</div></div><div class="summary-grid">${k.map(x=>`<div class="summary-box"><div class="summary-label">${x}</div><div class="summary-value${prevDebug[x]!==d[x]&&d[x]!=='-'?' updated':''}">${d[x]}</div></div>`).join('')}</div><div class="explain-list">${s.exprs.map(e=>`<div class="explain-item"><div class="explain-mark">${e.mark}</div><div>${e.text}</div></div>`).join('')}</div>`; prevDebug={...d};}
function renderOutput(lines){document.getElementById('output-lines').innerHTML=lines.map((l,i)=>`<div class="out-line">${i===0?l:`<span class="out-num">${l}</span>`}</div>`).join('')}
function applyStep(i){const s=steps[i]; renderCode(s.line); renderDebug(s,s.debug); renderOutput(s.output); document.getElementById('stepInfo').textContent=`Step ${i+1} / ${steps.length}`}
function togglePlay(){playing=!playing;document.getElementById('playBtn').innerHTML=playing?'&#9646;&#9646; Pause':'&#9654; Play'; if(playing) tick(); else clearTimeout(timer)}
function tick(){if(!playing)return; if(currentStep>=steps.length-1){playing=false;document.getElementById('playBtn').innerHTML='&#9654; Play';return;} currentStep++; applyStep(currentStep); timer=setTimeout(tick,parseInt(speedSel.value))}
function resetAnim(){playing=false;clearTimeout(timer);currentStep=0;prevDebug={};document.getElementById('playBtn').innerHTML='&#9654; Play';applyStep(0)}
applyStep(0);
</script>
</body>
</html>
