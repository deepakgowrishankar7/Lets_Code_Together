<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Armstrong Number Visualizer</title>
<style>
  :root {
    --bg: #0b1020;
    --panel: #12172a;
    --panel2: #171d34;
    --border: rgba(255,255,255,.08);
    --text: #e9eeff;
    --muted: #9aa3c7;
    --accent: #7c9cff;
    --accent2: #67e8a8;
    --warn: #ffb86b;
    --danger: #ff7373;
    --shadow: 0 18px 50px rgba(0,0,0,.28);
    --radius: 18px;
    --mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', monospace;
    --sans: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  body {
    font-family: var(--mono);
    background:
      radial-gradient(circle at top left, rgba(124,156,255,.18), transparent 28%),
      radial-gradient(circle at bottom right, rgba(103,232,168,.12), transparent 25%),
      var(--bg);
    color: var(--text);
    padding: 20px;
  }

  .container {
    max-width: 1200px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    background: rgba(10,14,28,.92);
    box-shadow: var(--shadow);
    backdrop-filter: blur(12px);
  }

  .top {
    display: flex;
    min-height: 520px;
  }

  .code-panel {
    flex: 1;
    position: relative;
    background: linear-gradient(180deg, #161b31, #12162a);
    padding: 18px;
    overflow: auto;
    border-right: 1px solid var(--border);
  }

  .debug-panel {
    width: 380px;
    background: linear-gradient(180deg, #11162a, #0f1426);
    padding: 18px;
    border-left: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  .output-panel {
    background: rgba(255,255,255,.03);
    border-top: 1px solid var(--border);
    padding: 14px 18px;
    min-height: 92px;
  }

  .panel-title {
    font-family: var(--sans);
    font-size: 12px;
    font-weight: 700;
    letter-spacing: .08em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 12px;
  }

  .code-line {
    font-size: 13px;
    line-height: 1.9;
    color: #d7defc;
    white-space: pre;
    display: flex;
    align-items: center;
    gap: 8px;
    border-radius: 10px;
    padding: 0 10px;
    transition: all .2s ease;
  }

  .code-line.highlight {
    background: rgba(124,156,255,.16);
    box-shadow: inset 0 0 0 1px rgba(124,156,255,.22);
  }

  .kw { color: #c792ea; }
  .str { color: #9ae6b4; }
  .num { color: #ffcf88; }
  .fn { color: #8bb6ff; }
  .cls { color: #ffe08a; }

  .step-card {
    border: 1px solid var(--border);
    border-radius: 16px;
    background: rgba(255,255,255,.03);
    padding: 14px;
  }

  .step-badge-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    margin-bottom: 10px;
  }

  .step-badge {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 6px 10px;
    border-radius: 999px;
    background: rgba(124,156,255,.16);
    color: #cfe0ff;
    font-family: var(--sans);
    font-size: 12px;
    font-weight: 700;
    letter-spacing: .02em;
  }

  .step-progress {
    font-family: var(--sans);
    font-size: 12px;
    color: var(--muted);
  }

  .step-title {
    font-family: var(--sans);
    font-size: 18px;
    font-weight: 800;
    color: var(--text);
    margin-bottom: 8px;
    line-height: 1.3;
  }

  .step-desc {
    font-family: var(--sans);
    font-size: 13px;
    line-height: 1.6;
    color: #d9dfff;
    margin-bottom: 14px;
  }

  .progress-bar {
    width: 100%;
    height: 8px;
    background: rgba(255,255,255,.07);
    border-radius: 999px;
    overflow: hidden;
    margin-bottom: 6px;
  }

  .progress-fill {
    height: 100%;
    width: 0%;
    border-radius: 999px;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    transition: width .25s ease;
  }

  .progress-label {
    font-family: var(--sans);
    font-size: 12px;
    color: var(--muted);
  }

  .summary-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }

  .summary-box {
    border: 1px solid var(--border);
    border-radius: 14px;
    background: rgba(255,255,255,.03);
    padding: 10px 12px;
  }

  .summary-label {
    font-family: var(--sans);
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: .06em;
    color: var(--muted);
    margin-bottom: 4px;
  }

  .summary-value {
    font-size: 18px;
    font-weight: 800;
    color: var(--text);
    word-break: break-word;
  }

  .summary-value.updated {
    color: var(--accent);
  }

  .explain-list {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .explain-item {
    display: flex;
    gap: 10px;
    align-items: flex-start;
    font-family: var(--sans);
    font-size: 13px;
    line-height: 1.5;
    color: #d9dfff;
    padding: 10px 12px;
    border: 1px solid var(--border);
    border-radius: 12px;
    background: rgba(255,255,255,.03);
  }

  .explain-mark {
    width: 22px;
    height: 22px;
    flex: 0 0 22px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 12px;
    font-weight: 800;
    margin-top: 1px;
    background: rgba(124,156,255,.16);
    color: #d5e3ff;
  }

  .truth { color: var(--accent2); font-weight: 800; }
  .false { color: var(--danger); font-weight: 800; }

  .out-line {
    font-size: 13px;
    color: #e9edff;
    line-height: 1.8;
    margin: 4px 0;
  }

  .out-line .out-num {
    color: var(--accent);
    font-weight: 800;
  }

  .controls {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
    padding: 12px 18px;
    background: rgba(255,255,255,.03);
    border-top: 1px solid var(--border);
    font-family: var(--sans);
  }

  .btn,
  select {
    border: 1px solid var(--border);
    border-radius: 12px;
    background: rgba(255,255,255,.04);
    color: var(--text);
    font-size: 13px;
  }

  .btn {
    padding: 9px 16px;
    cursor: pointer;
    transition: all .2s ease;
  }

  .btn:hover,
  select:hover {
    transform: translateY(-1px);
    background: rgba(255,255,255,.08);
  }

  .btn.primary {
    background: linear-gradient(135deg, #4f77ff, #7c9cff);
    border-color: transparent;
    color: #fff;
  }

  .btn.primary:hover {
    filter: brightness(1.05);
  }

  select {
    padding: 8px 10px;
    outline: none;
    background: #1b2140;
    color: #e9eeff;
    appearance: none;
    -webkit-appearance: none;
    -moz-appearance: none;
  }

  select:focus {
    background: #232a4d;
    color: #ffffff;
  }

  select option {
    background: #1b2140;
    color: #e9eeff;
  }

  select option:checked {
    background: #2f3a66;
    color: #ffffff;
  }

  .speed-label,
  .topic-label,
  .step-info {
    font-size: 12px;
    color: var(--muted);
  }

  .topic-label {
    margin-left: auto;
    padding-left: 12px;
  }

  .code-wrap {
    position: relative;
  }

  .project-badge {
    position: absolute;
    right: 18px;
    bottom: 16px;
    font-family: var(--sans);
    font-size: 12px;
    color: rgba(255,255,255,.22);
    letter-spacing: .08em;
    pointer-events: none;
    user-select: none;
  }

  @media (max-width: 980px) {
    .top {
      flex-direction: column;
    }

    .debug-panel {
      width: 100%;
      border-left: 0;
      border-top: 1px solid var(--border);
    }

    .code-panel {
      border-right: 0;
      border-bottom: 1px solid var(--border);
    }

    .topic-label {
      margin-left: 0;
      width: 100%;
    }
  }
</style>
</head>
<body>
<div class="container">
  <div class="top">
    <div class="code-panel code-wrap">
      <div id="code-lines"></div>
      <div class="project-badge">Armstrong Number Visualizer</div>
    </div>

    <div class="debug-panel">
      <div class="panel-title">Debug Window</div>
      <div id="debug-content"></div>
    </div>
  </div>

  <div class="output-panel">
    <div class="panel-title">Output Window</div>
    <div id="output-lines"></div>
  </div>

  <div class="controls">
    <button class="btn primary" id="playBtn" onclick="togglePlay()">&#9654; Play</button>
    <button class="btn" onclick="resetAnim()">&#8635; Reset</button>
    <span class="speed-label">Speed:</span>
    <select id="speedSel">
      <option value="3000">3 sec</option>
      <option value="2500">2.5 sec</option>
      <option value="2000">2 sec</option>
      <option value="1500">1.5 sec</option>
      <option value="1000" selected>1 sec</option>
      <option value="750">0.75 sec</option>
      <option value="500">0.5 sec</option>
      <option value="100">0.1 sec</option>
    </select>
    <span class="step-info" id="stepInfo">Step 0 / 0</span>
    <span class="topic-label">Java Program — Armstrong Number</span>
  </div>
</div>

<script>
const codeLines = [
  { text: '<span class="kw">public class</span> <span class="cls">ArmstrongNumber</span> {', indent: 0 },
  { text: '  <span class="kw">public static void</span> <span class="fn">main</span>(<span class="cls">String</span>[] args) {', indent: 0 },
  { text: '    <span class="cls">Scanner</span> sc = <span class="kw">new</span> <span class="cls">Scanner</span>(<span class="cls">System</span>.in);', indent: 0 },
  { text: '    <span class="kw">int</span> n = sc.nextInt();', indent: 0 },
  { text: '    <span class="kw">int</span> original = n;', indent: 0 },
  { text: '    <span class="kw">int</span> digits = <span class="num">0</span>;', indent: 0 },
  { text: '    <span class="kw">int</span> temp = n;', indent: 0 },
  { text: '    <span class="kw">while</span> (temp != <span class="num">0</span>) {', indent: 0 },
  { text: '      digits++;', indent: 0 },
  { text: '      temp = temp / <span class="num">10</span>;', indent: 0 },
  { text: '    }', indent: 0 },
  { text: '    <span class="kw">int</span> sum = <span class="num">0</span>;', indent: 0 },
  { text: '    temp = n;', indent: 0 },
  { text: '    <span class="kw">while</span> (temp != <span class="num">0</span>) {', indent: 0 },
  { text: '      <span class="kw">int</span> digit = temp % <span class="num">10</span>;', indent: 0 },
  { text: '      sum = sum + (<span class="cls">Math</span>.pow(digit, digits));', indent: 0 },
  { text: '      temp = temp / <span class="num">10</span>;', indent: 0 },
  { text: '    }', indent: 0 },
  { text: '    <span class="kw">if</span> (original == sum) {', indent: 0 },
  { text: '      <span class="cls">System</span>.out.println(original + <span class="str">" is Armstrong"</span>);', indent: 0 },
  { text: '    } <span class="kw">else</span> {', indent: 0 },
  { text: '      <span class="cls">System</span>.out.println(original + <span class="str">" is Not Armstrong"</span>);', indent: 0 },
  { text: '    }', indent: 0 },
  { text: '  }', indent: 0 },
  { text: '}', indent: 0 },
];

const steps = [
  {
    line: 2,
    stage: 'Initialize',
    title: 'Create Scanner',
    desc: 'The program begins by creating a Scanner object to read the input number.',
    debug: { n: '-', original: '-', digits: '-', digit: '-', sum: '-' },
    exprs: [{ mark: '1', text: 'Scanner created for input.' }],
    output: []
  },
  {
    line: 3,
    stage: 'Input',
    title: 'Read the number',
    desc: 'The user enters a number. Here we use 153 as the sample input.',
    debug: { n: '153', original: '-', digits: '-', digit: '-', sum: '-' },
    exprs: [{ mark: '1', text: 'Input received: n = 153' }],
    output: ['Enter n value', '153']
  },
  {
    line: 4,
    stage: 'Setup',
    title: 'Store original number',
    desc: 'The original value is saved for the final comparison.',
    debug: { n: '153', original: '153', digits: '-', digit: '-', sum: '-' },
    exprs: [{ mark: '1', text: 'original = 153' }],
    output: ['Enter n value', '153']
  },
  {
    line: 5,
    stage: 'Setup',
    title: 'Count digits',
    desc: 'First we prepare a digit counter that will be used for the power calculation.',
    debug: { n: '153', original: '153', digits: '0', digit: '-', sum: '-' },
    exprs: [{ mark: '1', text: 'digits = 0' }],
    output: ['Enter n value', '153']
  },
  {
    line: 6,
    stage: 'Setup',
    title: 'Copy number to temp',
    desc: 'A temporary copy is used so the original number remains unchanged.',
    debug: { n: '153', original: '153', digits: '0', digit: '-', sum: '-' },
    exprs: [{ mark: '1', text: 'temp = 153' }],
    output: ['Enter n value', '153']
  },
  {
    line: 7,
    stage: 'Count',
    title: 'Start digit counting',
    desc: 'The loop runs while temp is not 0.',
    debug: { n: '153', original: '153', digits: '0', digit: '-', sum: '-' },
    exprs: [{ mark: '1', text: '153 != 0 → <span class="truth">true</span>' }],
    output: ['Enter n value', '153']
  },
  {
    line: 8,
    stage: 'Count',
    title: 'Increment digits',
    desc: 'One digit has been counted.',
    debug: { n: '153', original: '153', digits: '1', digit: '-', sum: '-' },
    exprs: [{ mark: '1', text: 'digits = 1' }],
    output: ['Enter n value', '153']
  },
  {
    line: 9,
    stage: 'Count',
    title: 'Reduce temp',
    desc: 'The last digit is removed by dividing temp by 10.',
    debug: { n: '153', original: '153', digits: '1', digit: '-', sum: '-' },
    exprs: [{ mark: '1', text: 'temp = 153 / 10 = 15' }],
    output: ['Enter n value', '153']
  },
  {
    line: 7,
    stage: 'Count',
    title: 'Count next digit',
    desc: 'The loop continues for the remaining digits.',
    debug: { n: '153', original: '153', digits: '1', digit: '-', sum: '-' },
    exprs: [{ mark: '1', text: '15 != 0 → <span class="truth">true</span>' }],
    output: ['Enter n value', '153']
  },
  {
    line: 8,
    stage: 'Count',
    title: 'Increment digits again',
    desc: 'Another digit is counted.',
    debug: { n: '153', original: '153', digits: '2', digit: '-', sum: '-' },
    exprs: [{ mark: '1', text: 'digits = 2' }],
    output: ['Enter n value', '153']
  },
  {
    line: 9,
    stage: 'Count',
    title: 'Reduce temp again',
    desc: 'The number is shortened again.',
    debug: { n: '153', original: '153', digits: '2', digit: '-', sum: '-' },
    exprs: [{ mark: '1', text: 'temp = 15 / 10 = 1' }],
    output: ['Enter n value', '153']
  },
  {
    line: 7,
    stage: 'Count',
    title: 'Count final digit',
    desc: 'The last remaining digit is counted.',
    debug: { n: '153', original: '153', digits: '2', digit: '-', sum: '-' },
    exprs: [{ mark: '1', text: '1 != 0 → <span class="truth">true</span>' }],
    output: ['Enter n value', '153']
  },
  {
    line: 8,
    stage: 'Count',
    title: 'Increment digits final time',
    desc: 'All digits have now been counted.',
    debug: { n: '153', original: '153', digits: '3', digit: '-', sum: '-' },
    exprs: [{ mark: '1', text: 'digits = 3' }],
    output: ['Enter n value', '153']
  },
  {
    line: 9,
    stage: 'Count',
    title: 'Finish counting',
    desc: 'The temp value becomes 0, so the digit-counting loop ends.',
    debug: { n: '153', original: '153', digits: '3', digit: '-', sum: '-' },
    exprs: [{ mark: '1', text: 'temp = 1 / 10 = 0' }],
    output: ['Enter n value', '153']
  },
  {
    line: 11,
    stage: 'Setup',
    title: 'Initialize sum',
    desc: 'The sum starts at 0 before adding powered digits.',
    debug: { n: '153', original: '153', digits: '3', digit: '-', sum: '0' },
    exprs: [{ mark: '1', text: 'sum = 0' }],
    output: ['Enter n value', '153']
  },
  {
    line: 12,
    stage: 'Setup',
    title: 'Reset temp again',
    desc: 'Temp is reset to the original number for the Armstrong calculation.',
    debug: { n: '153', original: '153', digits: '3', digit: '-', sum: '0' },
    exprs: [{ mark: '1', text: 'temp = 153' }],
    output: ['Enter n value', '153']
  },
  {
    line: 13,
    stage: 'Loop',
    title: 'Start Armstrong loop',
    desc: 'The program now processes each digit and raises it to the power of digits.',
    debug: { n: '153', original: '153', digits: '3', digit: '-', sum: '0' },
    exprs: [{ mark: '1', text: '153 != 0 → <span class="truth">true</span>' }],
    output: ['Enter n value', '153']
  },
  {
    line: 14,
    stage: 'Extract',
    title: 'Get last digit',
    desc: 'The last digit is extracted using modulo 10.',
    debug: { n: '153', original: '153', digits: '3', digit: '3', sum: '0' },
    exprs: [{ mark: '1', text: 'digit = 153 % 10 = 3' }],
    output: ['Enter n value', '153']
  },
  {
    line: 15,
    stage: 'Build',
    title: 'Add powered digit',
    desc: 'The digit is raised to the power of the number of digits and added to sum.',
    debug: { n: '153', original: '153', digits: '3', digit: '3', sum: '27' },
    exprs: [{ mark: '1', text: 'sum = 0 + 3^3 = 27' }],
    output: ['Enter n value', '153']
  },
  {
    line: 16,
    stage: 'Reduce',
    title: 'Remove processed digit',
    desc: 'The processed digit is removed from temp.',
    debug: { n: '15', original: '153', digits: '3', digit: '3', sum: '27' },
    exprs: [{ mark: '1', text: 'temp = 153 / 10 = 15' }],
    output: ['Enter n value', '153']
  },
  {
    line: 13,
    stage: 'Loop',
    title: 'Process next digit',
    desc: 'The loop repeats for the next digit.',
    debug: { n: '15', original: '153', digits: '3', digit: '3', sum: '27' },
    exprs: [{ mark: '1', text: '15 != 0 → <span class="truth">true</span>' }],
    output: ['Enter n value', '153']
  },
  {
    line: 14,
    stage: 'Extract',
    title: 'Get next digit',
    desc: 'The next digit is extracted.',
    debug: { n: '15', original: '153', digits: '3', digit: '5', sum: '27' },
    exprs: [{ mark: '1', text: 'digit = 15 % 10 = 5' }],
    output: ['Enter n value', '153']
  },
  {
    line: 15,
    stage: 'Build',
    title: 'Add next powered digit',
    desc: 'The powered digit is added to the sum.',
    debug: { n: '15', original: '153', digits: '3', digit: '5', sum: '152' },
    exprs: [{ mark: '1', text: 'sum = 27 + 5^3 = 152' }],
    output: ['Enter n value', '153']
  },
  {
    line: 16,
    stage: 'Reduce',
    title: 'Reduce temp again',
    desc: 'The number gets smaller again.',
    debug: { n: '1', original: '153', digits: '3', digit: '5', sum: '152' },
    exprs: [{ mark: '1', text: 'temp = 15 / 10 = 1' }],
    output: ['Enter n value', '153']
  },
  {
    line: 13,
    stage: 'Loop',
    title: 'Process final digit',
    desc: 'The loop continues one last time.',
    debug: { n: '1', original: '153', digits: '3', digit: '5', sum: '152' },
    exprs: [{ mark: '1', text: '1 != 0 → <span class="truth">true</span>' }],
    output: ['Enter n value', '153']
  },
  {
    line: 14,
    stage: 'Extract',
    title: 'Get final digit',
    desc: 'The final digit is extracted.',
    debug: { n: '1', original: '153', digits: '3', digit: '1', sum: '152' },
    exprs: [{ mark: '1', text: 'digit = 1 % 10 = 1' }],
    output: ['Enter n value', '153']
  },
  {
    line: 15,
    stage: 'Build',
    title: 'Complete sum',
    desc: 'The last digit is added to the total.',
    debug: { n: '1', original: '153', digits: '3', digit: '1', sum: '153' },
    exprs: [{ mark: '1', text: 'sum = 152 + 1^3 = 153' }],
    output: ['Enter n value', '153']
  },
  {
    line: 16,
    stage: 'Reduce',
    title: 'End the loop',
    desc: 'Temp becomes 0, so the Armstrong loop stops.',
    debug: { n: '0', original: '153', digits: '3', digit: '1', sum: '153' },
    exprs: [{ mark: '1', text: 'temp = 1 / 10 = 0' }],
    output: ['Enter n value', '153']
  },
  {
    line: 17,
    stage: 'Decision',
    title: 'Compare values',
    desc: 'Now the original number is compared with the computed sum.',
    debug: { n: '0', original: '153', digits: '3', digit: '1', sum: '153' },
    exprs: [{ mark: '1', text: 'original == sum → <span class="truth">true</span>' }],
    output: ['Enter n value', '153']
  },
  {
    line: 18,
    stage: 'Output',
    title: 'Print result',
    desc: 'Since the values match, the number is an Armstrong number.',
    debug: { n: '0', original: '153', digits: '3', digit: '1', sum: '153' },
    exprs: [{ mark: '✓', text: '153 is Armstrong' }],
    output: ['Enter n value', '153', '153 is Armstrong']
  }
];

const debugKeys = ['n', 'original', 'digits', 'digit', 'sum'];
let currentStep = 0;
let playing = false;
let timer = null;
let prevDebug = {};

function renderCode(highlightLine) {
  document.getElementById('code-lines').innerHTML = codeLines.map((l, i) =>
    `<div class="code-line${i === highlightLine ? ' highlight' : ''}">${l.text}</div>`
  ).join('');
}

function renderDebug(step, debug) {
  const el = document.getElementById('debug-content');
  const percent = Math.round(((currentStep + 1) / steps.length) * 100);

  const grid = debugKeys.map(k => {
    const changed = prevDebug[k] !== debug[k] && debug[k] !== '-';
    return `<div class="summary-box">
      <div class="summary-label">${k}</div>
      <div class="summary-value${changed ? ' updated' : ''}">${debug[k]}</div>
    </div>`;
  }).join('');

  const exprHTML = step.exprs.map(e => `
    <div class="explain-item">
      <div class="explain-mark">${e.mark}</div>
      <div>${e.text}</div>
    </div>
  `).join('');

  el.innerHTML = `
    <div class="step-card">
      <div class="step-badge-row">
        <div class="step-badge">${step.stage}</div>
        <div class="step-progress">Step ${currentStep + 1} / ${steps.length}</div>
      </div>
      <div class="step-title">${step.title}</div>
      <div class="step-desc">${step.desc}</div>
      <div class="progress-bar">
        <div class="progress-fill" style="width:${percent}%"></div>
      </div>
      <div class="progress-label">${percent}% complete</div>
    </div>

    <div class="summary-grid">
      ${grid}
    </div>

    <div class="explain-list">
      ${exprHTML}
    </div>
  `;

  prevDebug = { ...debug };
}

function renderOutput(lines) {
  document.getElementById('output-lines').innerHTML = lines.map((l, i) =>
    `<div class="out-line">${i === 0 ? l : `<span class="out-num">${l}</span>`}</div>`
  ).join('');
}

function applyStep(idx) {
  const s = steps[idx];
  renderCode(s.line);
  renderDebug(s, s.debug);
  renderOutput(s.output);
  document.getElementById('stepInfo').textContent = `Step ${idx + 1} / ${steps.length}`;
}

function togglePlay() {
  playing = !playing;
  document.getElementById('playBtn').innerHTML = playing ? '&#9646;&#9646; Pause' : '&#9654; Play';
  if (playing) tick();
  else clearTimeout(timer);
}

function tick() {
  if (!playing) return;
  if (currentStep >= steps.length - 1) {
    playing = false;
    document.getElementById('playBtn').innerHTML = '&#9654; Play';
    return;
  }
  currentStep++;
  applyStep(currentStep);
  timer = setTimeout(tick, parseInt(document.getElementById('speedSel').value));
}

function resetAnim() {
  playing = false;
  clearTimeout(timer);
  currentStep = 0;
  prevDebug = {};
  document.getElementById('playBtn').innerHTML = '&#9654; Play';
  applyStep(0);
}

applyStep(0);
</script>
</body>
</html>
