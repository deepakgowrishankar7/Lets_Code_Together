<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Let's Code Together — 3D Admin Portal</title>

<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="custom-popup.css">
<script src="custom-popup.js"></script>

<style>
/* ─── DESIGN TOKENS & DUAL THEME ENGINE ─── */
:root {
  --font-main: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
  --font-mono: 'JetBrains Mono', monospace;
  --transition-theme: background 0.4s cubic-bezier(0.16, 1, 0.3, 1), color 0.4s cubic-bezier(0.16, 1, 0.3, 1), border-color 0.4s cubic-bezier(0.16, 1, 0.3, 1);
}

/* 🌙 DARK MODE (Cyber Stealth Cockpit) */
[data-theme="dark"] {
  --bg-base: #030712;
  --bg-gradient: radial-gradient(circle at 50% 20%, rgba(16, 185, 129, 0.08) 0%, transparent 55%),
                 radial-gradient(circle at 85% 80%, rgba(56, 189, 248, 0.06) 0%, transparent 50%),
                 radial-gradient(circle at 15% 90%, rgba(124, 58, 237, 0.05) 0%, transparent 45%),
                 #030712;
  --card-bg: rgba(15, 23, 42, 0.72);
  --card-border: rgba(255, 255, 255, 0.09);
  --card-border-glow: rgba(16, 185, 129, 0.35);
  --card-shadow: 0 35px 80px -20px rgba(0, 0, 0, 0.85), 0 0 50px rgba(16, 185, 129, 0.1);
  --card-inner-glow: inset 0 1px 0 rgba(255, 255, 255, 0.12), inset 0 0 20px rgba(16, 185, 129, 0.04);
  --text-main: #f8fafc;
  --text-muted: #94a3b8;
  --text-dim: #64748b;
  --accent-emerald: #10b981;
  --accent-emerald-dim: rgba(16, 185, 129, 0.14);
  --accent-cyan: #06b6d4;
  --input-bg: rgba(2, 6, 23, 0.65);
  --input-border: rgba(255, 255, 255, 0.1);
  --input-text: #ffffff;
  --input-focus-border: #10b981;
  --input-focus-glow: rgba(16, 185, 129, 0.22);
  --btn-gradient: linear-gradient(135deg, #10b981 0%, #059669 100%);
  --btn-shadow: 0 10px 30px -5px rgba(16, 185, 129, 0.45);
  --grid-line: rgba(255, 255, 255, 0.025);
  --topbar-bg: rgba(15, 23, 42, 0.6);
  --topbar-border: rgba(255, 255, 255, 0.07);
  --badge-bg: rgba(16, 185, 129, 0.1);
  --badge-border: rgba(16, 185, 129, 0.25);
  --badge-text: #34d399;
  --pill-bg: rgba(255, 255, 255, 0.04);
  --pill-border: rgba(255, 255, 255, 0.08);
  --pill-text: #94a3b8;
}

/* ☀️ LIGHT MODE (Pristine Frosted Glass) */
[data-theme="light"] {
  --bg-base: #f8fafc;
  --bg-gradient: radial-gradient(circle at 20% 20%, rgba(37, 99, 235, 0.08) 0%, transparent 50%),
                 radial-gradient(circle at 80% 80%, rgba(16, 185, 129, 0.08) 0%, transparent 55%),
                 radial-gradient(circle at 50% 50%, rgba(241, 245, 249, 0.9) 0%, transparent 80%),
                 #f8fafc;
  --card-bg: rgba(255, 255, 255, 0.88);
  --card-border: rgba(226, 232, 240, 0.9);
  --card-border-glow: rgba(16, 185, 129, 0.45);
  --card-shadow: 0 30px 70px -15px rgba(15, 23, 42, 0.12), 0 0 40px rgba(16, 185, 129, 0.08);
  --card-inner-glow: inset 0 1px 0 rgba(255, 255, 255, 1), inset 0 0 25px rgba(16, 185, 129, 0.03);
  --text-main: #0f172a;
  --text-muted: #475569;
  --text-dim: #64748b;
  --accent-emerald: #059669;
  --accent-emerald-dim: rgba(5, 150, 105, 0.1);
  --accent-cyan: #0284c7;
  --input-bg: rgba(248, 250, 252, 0.95);
  --input-border: rgba(203, 213, 225, 0.9);
  --input-text: #0f172a;
  --input-focus-border: #059669;
  --input-focus-glow: rgba(5, 150, 105, 0.18);
  --btn-gradient: linear-gradient(135deg, #059669 0%, #047857 100%);
  --btn-shadow: 0 12px 28px -5px rgba(5, 150, 105, 0.35);
  --grid-line: rgba(15, 23, 42, 0.03);
  --topbar-bg: rgba(255, 255, 255, 0.85);
  --topbar-border: rgba(226, 232, 240, 0.8);
  --badge-bg: rgba(5, 150, 105, 0.09);
  --badge-border: rgba(5, 150, 105, 0.25);
  --badge-text: #059669;
  --pill-bg: rgba(241, 245, 249, 0.8);
  --pill-border: rgba(226, 232, 240, 0.9);
  --pill-text: #475569;
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: var(--font-main);
}

body {
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  background: var(--bg-gradient);
  color: var(--text-main);
  overflow-x: hidden;
  position: relative;
  transition: var(--transition-theme);
}

/* Subtle Animated 3D Grid Overlay */
.grid-overlay {
  position: absolute;
  inset: 0;
  background-image: 
    linear-gradient(var(--grid-line) 1px, transparent 1px),
    linear-gradient(90deg, var(--grid-line) 1px, transparent 1px);
  background-size: 48px 48px;
  pointer-events: none;
  z-index: 0;
  mask-image: radial-gradient(circle at center, black 40%, transparent 85%);
  -webkit-mask-image: radial-gradient(circle at center, black 40%, transparent 85%);
}

/* Ambient 3D Depth Glow Orb */
.ambient-orb {
  position: absolute;
  width: 550px;
  height: 550px;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(16, 185, 129, 0.12) 0%, rgba(56, 189, 248, 0.06) 45%, transparent 70%);
  filter: blur(50px);
  pointer-events: none;
  z-index: 0;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  transition: transform 0.2s ease-out;
}

/* ─── TOP NAVBAR ─── */
.topbar {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  padding: 16px 36px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  z-index: 20;
  background: var(--topbar-bg);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border-bottom: 1px solid var(--topbar-border);
  transition: var(--transition-theme);
}

.brand-section {
  display: flex;
  align-items: center;
  gap: 14px;
  text-decoration: none;
  color: inherit;
}

.brand-logo {
  width: 32px;
  height: 32px;
  border-radius: 8px;
  box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3);
  transition: transform 0.3s ease;
}

.brand-section:hover .brand-logo {
  transform: scale(1.08) rotate(3deg);
}

.brand-title {
  font-size: 15px;
  font-weight: 700;
  letter-spacing: -0.01em;
  display: flex;
  align-items: center;
  gap: 8px;
}

.brand-tag {
  font-family: var(--font-mono);
  font-size: 10px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 1.5px;
  padding: 3px 8px;
  background: var(--badge-bg);
  border: 1px solid var(--badge-border);
  color: var(--badge-text);
  border-radius: 5px;
}

.topbar-controls {
  display: flex;
  align-items: center;
  gap: 16px;
}

/* Live Security Status Badge */
.status-pill {
  display: flex;
  align-items: center;
  gap: 8px;
  font-family: var(--font-mono);
  font-size: 11px;
  letter-spacing: 1px;
  color: var(--text-muted);
  background: var(--pill-bg);
  border: 1px solid var(--pill-border);
  padding: 6px 12px;
  border-radius: 20px;
}

.status-dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: #10b981;
  box-shadow: 0 0 10px #10b981;
  animation: pulseDot 2.2s infinite ease-in-out;
}

@keyframes pulseDot {
  0%, 100% { opacity: 1; transform: scale(1); }
  50% { opacity: 0.45; transform: scale(1.3); }
}

/* Modern Theme Switcher Button */
.theme-switch-btn {
  display: flex;
  align-items: center;
  gap: 8px;
  background: var(--pill-bg);
  border: 1px solid var(--pill-border);
  color: var(--text-main);
  padding: 6px 14px;
  border-radius: 20px;
  font-size: 12px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.25s ease;
}

.theme-switch-btn:hover {
  border-color: var(--accent-emerald);
  transform: translateY(-1px);
  box-shadow: 0 4px 12px rgba(16, 185, 129, 0.15);
}

.theme-icon {
  font-size: 14px;
  display: inline-block;
  transition: transform 0.3s ease;
}

.theme-switch-btn:hover .theme-icon {
  transform: rotate(20deg) scale(1.15);
}

/* ─── 3D STAGE & PORTAL CARD ─── */
.portal-stage {
  perspective: 1400px;
  z-index: 2;
  width: 100%;
  max-width: 480px;
  padding: 24px;
  margin-top: 50px;
}

.card-3d-wrapper {
  position: relative;
  border-radius: 24px;
  transform-style: preserve-3d;
  transition: transform 0.18s cubic-bezier(0.2, 0, 0, 1), box-shadow 0.3s ease;
  will-change: transform;
}

.portal-card {
  position: relative;
  background: var(--card-bg);
  border: 1px solid var(--card-border);
  border-radius: 24px;
  padding: 44px 38px 36px;
  box-shadow: var(--card-shadow), var(--card-inner-glow);
  backdrop-filter: blur(28px);
  -webkit-backdrop-filter: blur(28px);
  overflow: hidden;
  transform-style: preserve-3d;
}

/* Specular Light Reflection */
.specular-shine {
  position: absolute;
  inset: 0;
  border-radius: 24px;
  background: radial-gradient(circle 380px at var(--shine-x, 50%) var(--shine-y, 50%), rgba(255, 255, 255, 0.18) 0%, transparent 70%);
  pointer-events: none;
  opacity: var(--shine-opacity, 0);
  transition: opacity 0.3s ease;
  z-index: 10;
}

[data-theme="light"] .specular-shine {
  background: radial-gradient(circle 380px at var(--shine-x, 50%) var(--shine-y, 50%), rgba(255, 255, 255, 0.65) 0%, transparent 70%);
}

/* 3D Depth Card Layers */
.card-header-3d {
  text-align: center;
  transform: translateZ(35px);
  transform-style: preserve-3d;
  margin-bottom: 28px;
}

.shield-badge-3d {
  width: 58px;
  height: 58px;
  margin: 0 auto 16px;
  border-radius: 16px;
  background: var(--accent-emerald-dim);
  border: 1px solid var(--badge-border);
  display: grid;
  place-items: center;
  font-size: 26px;
  box-shadow: 0 8px 24px rgba(16, 185, 129, 0.25);
  transform: translateZ(45px);
  transition: transform 0.3s ease;
}

.shield-badge-3d:hover {
  transform: translateZ(55px) scale(1.06);
}

.card-title {
  font-size: 26px;
  font-weight: 800;
  letter-spacing: -0.02em;
  color: var(--text-main);
  margin-bottom: 6px;
}

.card-title span {
  color: var(--accent-emerald);
}

.card-subtitle {
  font-family: var(--font-mono);
  font-size: 11px;
  letter-spacing: 2px;
  text-transform: uppercase;
  color: var(--text-muted);
}

/* Form Container */
.card-form-3d {
  transform: translateZ(28px);
  transform-style: preserve-3d;
}

.form-group {
  margin-bottom: 20px;
  position: relative;
}

.form-label {
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-family: var(--font-mono);
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  color: var(--text-muted);
  margin-bottom: 8px;
}

.input-wrapper {
  position: relative;
  display: flex;
  align-items: center;
}

.input-icon {
  position: absolute;
  left: 14px;
  font-size: 15px;
  color: var(--text-dim);
  pointer-events: none;
  transition: color 0.25s ease;
}

.input-3d {
  width: 100%;
  padding: 13px 44px 13px 40px;
  border-radius: 12px;
  border: 1px solid var(--input-border);
  background: var(--input-bg);
  color: var(--input-text);
  font-size: 14px;
  font-weight: 500;
  outline: none;
  transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
  box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.04);
}

.input-3d::placeholder {
  color: var(--text-dim);
  opacity: 0.65;
}

.input-3d:focus {
  border-color: var(--input-focus-border);
  box-shadow: 0 0 0 3px var(--input-focus-glow), inset 0 1px 2px rgba(0, 0, 0, 0.02);
}

.input-3d:focus + .input-icon,
.input-wrapper:focus-within .input-icon {
  color: var(--accent-emerald);
}

.btn-toggle-eye {
  position: absolute;
  right: 12px;
  background: none;
  border: none;
  color: var(--text-dim);
  font-size: 14px;
  cursor: pointer;
  padding: 4px;
  display: grid;
  place-items: center;
  transition: color 0.2s ease;
}

.btn-toggle-eye:hover {
  color: var(--text-main);
}

/* Submit Button */
.btn-auth-3d {
  width: 100%;
  padding: 15px 24px;
  border: none;
  border-radius: 12px;
  background: var(--btn-gradient);
  color: #ffffff;
  font-family: var(--font-mono);
  font-size: 13px;
  font-weight: 700;
  letter-spacing: 2px;
  text-transform: uppercase;
  cursor: pointer;
  box-shadow: var(--btn-shadow);
  transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  margin-top: 10px;
  transform: translateZ(35px);
  position: relative;
  overflow: hidden;
}

.btn-auth-3d::before {
  content: '';
  position: absolute;
  top: 0; left: -100%;
  width: 100%; height: 100%;
  background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.25), transparent);
  transition: left 0.5s ease;
}

.btn-auth-3d:hover {
  transform: translateZ(42px) translateY(-2px);
  box-shadow: 0 16px 36px -5px rgba(16, 185, 129, 0.55);
}

.btn-auth-3d:hover::before {
  left: 100%;
}

.btn-auth-3d:active {
  transform: translateZ(30px) translateY(1px);
}

/* Loading Spinner on Button */
.spinner-btn {
  display: none;
  width: 16px;
  height: 16px;
  border: 2px solid rgba(255, 255, 255, 0.3);
  border-top-color: #ffffff;
  border-radius: 50%;
  animation: spin 0.6s linear infinite;
}

@keyframes spin {
  to { transform: rotate(360deg); }
}

/* Secondary Back Button */
.btn-back-3d {
  width: 100%;
  padding: 12px 20px;
  margin-top: 12px;
  background: transparent;
  border: 1px solid var(--pill-border);
  color: var(--text-muted);
  border-radius: 10px;
  font-size: 12px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.2s ease;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  text-decoration: none;
}

.btn-back-3d:hover {
  background: var(--pill-bg);
  color: var(--text-main);
  border-color: var(--card-border-glow);
}

/* Error Alert Box */
#error {
  margin-top: 16px;
  padding: 12px 16px;
  border-radius: 10px;
  background: rgba(239, 68, 68, 0.1);
  border: 1px solid rgba(239, 68, 68, 0.25);
  color: #ef4444;
  font-family: var(--font-mono);
  font-size: 12px;
  display: none;
  animation: shake 0.35s ease;
}

#error:not(:empty) {
  display: block;
}

@keyframes shake {
  0%, 100% { transform: translateX(0); }
  25% { transform: translateX(-6px); }
  75% { transform: translateX(6px); }
}

/* 3D Security Feature Highlights */
.security-features-3d {
  margin-top: 26px;
  padding-top: 22px;
  border-top: 1px solid var(--pill-border);
  display: flex;
  justify-content: space-around;
  transform: translateZ(20px);
}

.sec-pill {
  display: flex;
  align-items: center;
  gap: 6px;
  font-family: var(--font-mono);
  font-size: 10.5px;
  color: var(--pill-text);
  letter-spacing: 0.5px;
}

.sec-pill span {
  color: var(--accent-emerald);
}

/* Responsive */
@media (max-width: 640px) {
  .topbar {
    padding: 12px 18px;
  }
  .brand-tag {
    display: none;
  }
  .portal-stage {
    padding: 16px;
    margin-top: 60px;
  }
  .portal-card {
    padding: 32px 24px;
  }
}
</style>
</head>

<body>

<!-- Background Animated Grid -->
<div class="grid-overlay"></div>

<!-- Ambient 3D Depth Glow Orb -->
<div class="ambient-orb" id="ambientOrb"></div>

<!-- TOP NAVBAR -->
<header class="topbar">
  <a href="index.html" class="brand-section">
    <img src="logo.png?v=3" class="brand-logo" alt="Let's Code Together Logo">
    <div class="brand-title">
      Let's Code Together
      <span class="brand-tag">Admin v2.0</span>
    </div>
  </a>

  <div class="topbar-controls">
    <div class="status-pill">
      <span class="status-dot"></span>
      <span>SECURE GATE</span>
    </div>

    <!-- Theme Switcher Toggle -->
    <button class="theme-switch-btn" id="themeToggleBtn" onclick="toggleAdminTheme()" title="Toggle Light / Dark Mode">
      <span class="theme-icon" id="themeIcon">☀️</span>
      <span id="themeLabel">Light</span>
    </button>
  </div>
</header>

<!-- 3D PORTAL STAGE -->
<main class="portal-stage">
  <div class="card-3d-wrapper" id="cardWrapper">
    <div class="portal-card">
      <div class="specular-shine" id="cardShine"></div>

      <!-- Header with 3D Elevation -->
      <div class="card-header-3d">
        <div class="shield-badge-3d">🛡️</div>
        <h1 class="card-title">Admin <span>Portal</span></h1>
        <p class="card-subtitle">Secure Gateway Access</p>
      </div>

      <!-- Login Form with 3D Depth -->
      <form class="card-form-3d" onsubmit="event.preventDefault(); adminLogin();">
        <div class="form-group">
          <label class="form-label">
            <span>Email Address</span>
            <span style="font-size: 10px; color: var(--accent-emerald);">// ID</span>
          </label>
          <div class="input-wrapper">
            <span class="input-icon">✉️</span>
            <input id="email" class="input-3d" type="email" placeholder="admin@example.com" autocomplete="email" required>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label">
            <span>Password</span>
            <span style="font-size: 10px; color: var(--accent-emerald);">// HASH</span>
          </label>
          <div class="input-wrapper">
            <span class="input-icon">🔒</span>
            <input id="password" class="input-3d" type="password" placeholder="••••••••••••" autocomplete="current-password" required>
            <button type="button" class="btn-toggle-eye" id="togglePasswordBtn" onclick="togglePasswordVisibility()" title="Show/Hide Password">
              👁️
            </button>
          </div>
        </div>

        <button type="submit" class="btn-auth-3d" id="authBtn">
          <span class="spinner-btn" id="authSpinner"></span>
          <span id="btnText">Authenticate</span>
          <span style="font-size: 14px;">→</span>
        </button>

        <a href="index.html" class="btn-back-3d">
          <span>← Back to User Login</span>
        </a>

        <div id="error"></div>
      </form>

      <!-- 3D Security Features Bar -->
      <div class="security-features-3d">
        <div class="sec-pill"><span>🔒</span> 256-Bit SSL</div>
        <div class="sec-pill"><span>⚡</span> Zero Trust</div>
        <div class="sec-pill"><span>🛡️</span> Audit Log</div>
      </div>
    </div>
  </div>
</main>

<script>
// ─── 1. SESSION VERIFICATION ───
if (localStorage.getItem("adminSession") === "true") {
  window.location.href = "admin-notifications.html";
}

// ─── 2. DUAL THEME ENGINE (LIGHT & DARK MODE) ───
function initTheme() {
  const savedTheme = localStorage.getItem("adminTheme") || "dark";
  applyTheme(savedTheme);
}

function applyTheme(theme) {
  document.documentElement.setAttribute("data-theme", theme);
  localStorage.setItem("adminTheme", theme);

  const iconEl = document.getElementById("themeIcon");
  const labelEl = document.getElementById("themeLabel");

  if (theme === "light") {
    iconEl.textContent = "🌙";
    labelEl.textContent = "Dark";
  } else {
    iconEl.textContent = "☀️";
    labelEl.textContent = "Light";
  }
}

function toggleAdminTheme() {
  const current = document.documentElement.getAttribute("data-theme") || "dark";
  const target = current === "dark" ? "light" : "dark";
  applyTheme(target);
}

initTheme();

// ─── 3. INTERACTIVE 3D PERSPECTIVE PARALLAX & SPECULAR SHINE ───
(function init3DCardTilt() {
  const wrapper = document.getElementById("cardWrapper");
  const shine = document.getElementById("cardShine");
  const orb = document.getElementById("ambientOrb");
  if (!wrapper) return;

  window.addEventListener("mousemove", (e) => {
    const rect = wrapper.getBoundingClientRect();
    const cardCenterX = rect.left + rect.width / 2;
    const cardCenterY = rect.top + rect.height / 2;

    const mouseX = e.clientX;
    const mouseY = e.clientY;

    // Ambient orb movement
    if (orb) {
      const orbX = (mouseX - window.innerWidth / 2) * 0.08;
      const orbY = (mouseY - window.innerHeight / 2) * 0.08;
      orb.style.transform = `translate(calc(-50% + ${orbX}px), calc(-50% + ${orbY}px))`;
    }

    // Calculate distance from card
    const distX = mouseX - cardCenterX;
    const distY = mouseY - cardCenterY;
    const dist = Math.sqrt(distX * distX + distY * distY);

    if (dist < 600) {
      const maxTilt = 12; // Degrees
      const rotateY = ((distX / (rect.width / 2)) * maxTilt).toFixed(2);
      const rotateX = ((-distY / (rect.height / 2)) * maxTilt).toFixed(2);

      wrapper.style.transform = `perspective(1400px) rotateX(${rotateX}deg) rotateY(${rotateY}deg) translateY(-4px)`;

      // Specular shine coordinates
      const shineX = ((mouseX - rect.left) / rect.width) * 100;
      const shineY = ((mouseY - rect.top) / rect.height) * 100;

      shine.style.setProperty('--shine-x', `${shineX}%`);
      shine.style.setProperty('--shine-y', `${shineY}%`);
      shine.style.setProperty('--shine-opacity', '1');
    } else {
      wrapper.style.transform = `perspective(1400px) rotateX(0deg) rotateY(0deg) translateY(0px)`;
      shine.style.setProperty('--shine-opacity', '0');
    }
  });

  window.addEventListener("mouseleave", () => {
    wrapper.style.transform = `perspective(1400px) rotateX(0deg) rotateY(0deg) translateY(0px)`;
    shine.style.setProperty('--shine-opacity', '0');
  });
})();

// ─── 4. PASSWORD VISIBILITY TOGGLE ───
function togglePasswordVisibility() {
  const pwdInput = document.getElementById("password");
  const eyeBtn = document.getElementById("togglePasswordBtn");
  if (pwdInput.type === "password") {
    pwdInput.type = "text";
    eyeBtn.textContent = "🙈";
  } else {
    pwdInput.type = "password";
    eyeBtn.textContent = "👁️";
  }
}

// ─── 5. ADMIN AUTHENTICATION HANDLER ───
async function adminLogin() {
  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value.trim();
  const errorEl = document.getElementById("error");
  const authBtn = document.getElementById("authBtn");
  const authSpinner = document.getElementById("authSpinner");
  const btnText = document.getElementById("btnText");

  errorEl.innerText = "";
  errorEl.style.display = "none";

  if (!email || !password) {
    errorEl.innerText = "Email and password are required";
    errorEl.style.display = "block";
    return;
  }

  // Loading state
  authBtn.disabled = true;
  authSpinner.style.display = "inline-block";
  btnText.innerText = "Verifying...";

  try {
    const res = await fetch(`/api/admin-login`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ email, password })
    });

    const data = await res.json();

    if (res.ok) {
      localStorage.setItem("adminSession", "true");
      btnText.innerText = "Access Granted";
      setTimeout(() => {
        window.location.href = "admin-notifications.html";
      }, 400);
    } else {
      errorEl.innerText = data.message || data.error || "Authentication failed. Invalid credentials.";
      errorEl.style.display = "block";
      authBtn.disabled = false;
      authSpinner.style.display = "none";
      btnText.innerText = "Authenticate";
    }
  } catch (err) {
    errorEl.innerText = "Server connection error. Please ensure local server is running.";
    errorEl.style.display = "block";
    authBtn.disabled = false;
    authSpinner.style.display = "none";
    btnText.innerText = "Authenticate";
  }
}

function goToUserLogin() {
  window.location.href = "index.html";
}
</script>
