<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Let's Code Together — Admin Portal</title>

<link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Sora', sans-serif;
}

/* Background */

body{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background-image:url("backgroundimage.avif");
background-size:cover;
background-position:center;
background-repeat:no-repeat;
overflow:hidden;
}

/* dark overlay with gradient */

body::before{
content:"";
position:absolute;
top:0;
left:0;
width:100%;
height:100%;
background: linear-gradient(135deg, rgba(2,6,23,0.75) 0%, rgba(15,23,42,0.6) 50%, rgba(2,6,23,0.8) 100%);
z-index:0;
}

/* Animated grid lines overlay */
body::after{
content:"";
position:absolute;
top:0; left:0;
width:100%; height:100%;
background-image:
  linear-gradient(rgba(26,172,156,0.04) 1px, transparent 1px),
  linear-gradient(90deg, rgba(26,172,156,0.04) 1px, transparent 1px);
background-size: 60px 60px;
z-index:0;
animation: gridShift 20s linear infinite;
}

@keyframes gridShift {
  0% { transform: translateY(0); }
  100% { transform: translateY(60px); }
}

/* TOP NAVBAR */

.navbar{
position:absolute;
top:28px;
left:36px;
z-index:5;
display:flex;
align-items:center;
gap:12px;
}

.logo{
width:22px;
cursor:pointer;
opacity:0.9;
filter: drop-shadow(0 0 8px rgba(26,172,156,0.5));
transition: filter 0.3s;
}

.logo:hover {
filter: drop-shadow(0 0 14px rgba(26,172,156,0.9));
}

/* Badge */
.nav-badge {
font-family: 'JetBrains Mono', monospace;
font-size: 10px;
letter-spacing: 2px;
color: rgba(26,172,156,0.7);
text-transform: uppercase;
padding: 3px 8px;
border: 1px solid rgba(26,172,156,0.2);
border-radius: 4px;
background: rgba(26,172,156,0.05);
}

/* Status dot top right */
.status-indicator {
position: absolute;
top: 28px;
right: 36px;
z-index: 5;
display: flex;
align-items: center;
gap: 8px;
font-family: 'JetBrains Mono', monospace;
font-size: 11px;
color: rgba(255,255,255,0.35);
letter-spacing: 1px;
}

.status-dot {
width: 7px;
height: 7px;
border-radius: 50%;
background: #1aac9c;
box-shadow: 0 0 8px #1aac9c;
animation: pulse 2s ease-in-out infinite;
}

@keyframes pulse {
  0%, 100% { opacity: 1; box-shadow: 0 0 8px #1aac9c; }
  50% { opacity: 0.5; box-shadow: 0 0 16px #1aac9c; }
}

/* center container */

.center-box{
position:relative;
z-index:2;
text-align:center;
display:flex;
flex-direction:column;
align-items:center;
}

/* Decorative top line */
.deco-line {
width: 1px;
height: 60px;
background: linear-gradient(to bottom, transparent, rgba(26,172,156,0.6));
margin: 0 auto 28px;
animation: fadeDown 1s ease forwards;
}

@keyframes fadeDown {
  from { height: 0; opacity: 0; }
  to { height: 60px; opacity: 1; }
}

/* admin title */

.admin-text{
color: rgba(255,255,255,0.92);
font-size: 13px;
margin-bottom: 10px;
letter-spacing: 5px;
font-weight: 400;
text-transform: uppercase;
font-family: 'JetBrains Mono', monospace;
color: rgba(26,172,156,0.8);
animation: fadeIn 0.8s ease forwards;
}

.admin-headline {
font-size: 42px;
font-weight: 700;
color: white;
letter-spacing: -1px;
margin-bottom: 36px;
line-height: 1.1;
animation: fadeIn 1s ease 0.2s both;
}

.admin-headline span {
color: #1aac9c;
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(12px); }
  to { opacity: 1; transform: translateY(0); }
}

/* Login button */

.admin-btn{
padding: 16px 52px;
font-size: 15px;
font-weight: 600;
color: white;
letter-spacing: 1.5px;
text-transform: uppercase;
font-family: 'JetBrains Mono', monospace;

border-radius: 6px;
border: 1px solid rgba(26,172,156,0.5);

background: linear-gradient(135deg, rgba(26,172,156,0.15), rgba(26,172,156,0.05));
backdrop-filter: blur(16px);

box-shadow:
  0 0 0 1px rgba(26,172,156,0.1) inset,
  0 8px 32px rgba(0,0,0,0.4),
  0 0 40px rgba(26,172,156,0.08);

cursor: pointer;
transition: all 0.3s ease;
position: relative;
overflow: hidden;
animation: fadeIn 1s ease 0.4s both;
}

.admin-btn::before {
content: '';
position: absolute;
top: 0; left: -100%;
width: 100%; height: 100%;
background: linear-gradient(90deg, transparent, rgba(26,172,156,0.12), transparent);
transition: left 0.5s ease;
}

.admin-btn:hover::before {
left: 100%;
}

.admin-btn:hover{
transform: translateY(-2px);
border-color: rgba(26,172,156,0.8);
box-shadow:
  0 0 0 1px rgba(26,172,156,0.2) inset,
  0 12px 40px rgba(0,0,0,0.5),
  0 0 60px rgba(26,172,156,0.15);
}

/* login form */

.login-box{
display:none;
margin-top: 0;
width: 420px;
padding: 44px 40px;
border-radius: 12px;
background: rgba(8,15,30,0.92);
border: 1px solid rgba(26,172,156,0.15);
box-shadow:
  0 0 0 1px rgba(255,255,255,0.03) inset,
  0 24px 60px rgba(0,0,0,0.7),
  0 0 80px rgba(26,172,156,0.06);
backdrop-filter: blur(24px);
animation: boxReveal 0.4s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
}

@keyframes boxReveal {
  from { opacity: 0; transform: translateY(20px) scale(0.97); }
  to { opacity: 1; transform: translateY(0) scale(1); }
}

/* heading */

.login-box h2{
margin-bottom: 6px;
color: white;
font-size: 22px;
font-weight: 700;
letter-spacing: -0.5px;
}

.login-box .sub{
font-size: 12px;
color: rgba(255,255,255,0.3);
letter-spacing: 2px;
text-transform: uppercase;
font-family: 'JetBrains Mono', monospace;
margin-bottom: 30px;
}

/* Divider */
.divider {
width: 100%;
height: 1px;
background: linear-gradient(to right, transparent, rgba(26,172,156,0.3), transparent);
margin-bottom: 28px;
}

/* input labels */
.field {
position: relative;
margin-bottom: 18px;
}

.field label {
display: block;
font-size: 11px;
font-family: 'JetBrains Mono', monospace;
letter-spacing: 2px;
color: rgba(26,172,156,0.7);
text-transform: uppercase;
margin-bottom: 8px;
}

/* inputs */

input{
width:100%;
padding: 13px 16px;
border-radius: 6px;
border: 1px solid rgba(255,255,255,0.06);
background: rgba(255,255,255,0.04);
color: white;
font-size: 14px;
font-family: 'Sora', sans-serif;
transition: all 0.25s ease;
outline: none;
}

input::placeholder {
color: rgba(255,255,255,0.2);
}

input:focus {
border-color: rgba(26,172,156,0.5);
background: rgba(26,172,156,0.05);
box-shadow: 0 0 0 3px rgba(26,172,156,0.08);
}

/* login button */

.login-btn{
width:100%;
padding: 14px;
border:none;
border-radius: 6px;
background: linear-gradient(135deg, #1aac9c, #12897c);
color: white;
font-size: 13px;
font-weight: 600;
letter-spacing: 2px;
text-transform: uppercase;
font-family: 'JetBrains Mono', monospace;
cursor: pointer;
transition: all 0.3s ease;
margin-top: 8px;
position: relative;
overflow: hidden;
box-shadow: 0 4px 20px rgba(26,172,156,0.3);
}

.login-btn::after {
content: '→';
margin-left: 8px;
transition: transform 0.3s ease;
display: inline-block;
}

.login-btn:hover{
background: linear-gradient(135deg, #1dc0af, #1aac9c);
box-shadow: 0 6px 28px rgba(26,172,156,0.5);
transform: translateY(-1px);
}

.login-btn:hover::after {
transform: translateX(4px);
}

#error{
margin-top: 14px;
color: #f87171;
font-size: 12px;
font-family: 'JetBrains Mono', monospace;
letter-spacing: 0.5px;
padding: 10px 14px;
border-radius: 6px;
background: rgba(248,113,113,0.08);
border: 1px solid rgba(248,113,113,0.15);
display: none;
}

#error:not(:empty) {
display: block;
}

</style>
</head>

<body>

<!-- LOGO -->
<div class="navbar">
  <img src="logo.jpg" class="logo">
  <span class="nav-badge">System</span>
</div>

<!-- Status -->
<div class="status-indicator">
  <span class="status-dot"></span>
  SECURE
</div>

<div class="center-box">

  <div class="deco-line"></div>

  <p class="admin-text" id="adminText">Let's Code Together</p>
  <h1 class="admin-headline" id="adminHeadline">Admin <span>Portal</span></h1>

  <button class="admin-btn" id="mainBtn" onclick="showLogin()">
    Admin Login
  </button>

  <!-- LOGIN FORM -->

  <div class="login-box" id="loginBox">

    <h2>Welcome Back</h2>
    <p class="sub">Admin Authentication</p>
    <div class="divider"></div>

    <div class="field">
      <label>Email Address</label>
      <input id="email" placeholder="admin@example.com" onkeydown="if(event.key==='Enter') adminLogin()">
    </div>

    <div class="field">
      <label>Password</label>
      <input id="password" type="password" placeholder="••••••••••" onkeydown="if(event.key==='Enter') adminLogin()">
    </div>

    <button class="login-btn" onclick="adminLogin()">Authenticate</button>

    <button class="login-btn" style="background:transparent; border:1px solid rgba(255,255,255,0.06); color:#fff; margin-top:10px; box-shadow:none;" onclick="goToUserLogin()">Back to User Login</button>

    <div id="error"></div>

  </div>

</div>

<script>

const BASE_URL="";

if(localStorage.getItem("adminSession") === "true"){
window.location.href="admin-notifications.html";
}

function showLogin(){
document.getElementById("mainBtn").style.display="none";
document.getElementById("adminText").style.display="none";
document.getElementById("adminHeadline").style.display="none";
document.querySelector(".deco-line").style.display="none";
document.getElementById("loginBox").style.display="block";
}

async function adminLogin(){


  const email=document.getElementById("email").value.trim();
  const password=document.getElementById("password").value.trim();

  if (!email || !password) {
    document.getElementById("error").innerText = "Email and password are required";
    return;
  }

  try {
    const res=await fetch(`/api/admin-login`,{
      method:"POST",
      headers:{
        "Content-Type":"application/json"
      },
      body:JSON.stringify({email,password})
    });

    const data=await res.json();

    if(res.ok){
      localStorage.setItem("adminSession","true");
      window.location.href="admin-notifications.html";
    } else {
      document.getElementById("error").innerText=data.message || data.error || "Login failed";
    }
  } catch(err) {
    document.getElementById("error").innerText="Server connection error";
  }
}

function goToUserLogin(){
  window.location.href = "index.html";
}

</script>

</body>
</html>
