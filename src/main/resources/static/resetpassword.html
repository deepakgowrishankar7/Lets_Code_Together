<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password — Let's Code Together</title>
    
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="image/logo.png?v=3">
    <link rel="apple-touch-icon" href="image/logo.png?v=3">

    <!-- Custom Popup & Glassy Light Mode Styles -->
    <link rel="stylesheet" href="custom-popup.css">
    <link rel="stylesheet" href="index-light.css">
    <script src="custom-popup.js"></script>

    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#ffffff">
    <meta name="background-color" content="#ffffff">
    <style>
        .reset-page-container {
            min-height: calc(100vh - 80px);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
            box-sizing: border-box;
        }

        .reset-card-wrapper {
            width: 100%;
            max-width: 440px;
        }

        .reset-card-header {
            text-align: center;
            margin-bottom: 24px;
        }

        .reset-card-icon {
            width: 48px;
            height: 48px;
            border-radius: 14px;
            background: rgba(37, 99, 235, 0.08);
            border: 1px solid rgba(37, 99, 235, 0.2);
            color: var(--accent-blue);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 1.4rem;
            margin-bottom: 12px;
        }

        .reset-card-title {
            font-size: 1.5rem;
            font-weight: 800;
            color: var(--text-primary);
            margin: 0 0 6px 0;
            letter-spacing: -0.02em;
        }

        .reset-card-subtitle {
            font-size: 0.9rem;
            color: var(--text-secondary);
            margin: 0;
            line-height: 1.5;
        }

        .password-input-wrap {
            position: relative;
        }

        .toggle-eye-btn {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            font-size: 1.1rem;
            opacity: 0.6;
            transition: opacity 0.2s;
            user-select: none;
        }

        .toggle-eye-btn:hover {
            opacity: 1;
        }

        .back-to-login-link {
            display: block;
            text-align: center;
            margin-top: 20px;
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--accent-blue);
            text-decoration: none;
            transition: color 0.2s;
        }

        .back-to-login-link:hover {
            color: var(--accent-blue-hover);
            text-decoration: underline;
        }

        #status {
            margin-top: 16px;
            font-size: 0.9rem;
            font-weight: 600;
            text-align: center;
            min-height: 20px;
        }

        #status.success {
            color: var(--accent-green);
        }

        #status.error {
            color: #ef4444;
        }
    </style>
</head>
<body>

    <!-- Header & Navigation Bar (Matches Login Page) -->
    <header class="light-navbar">
        <a href="index.html" class="navbar-brand">
            <img src="image/logo.png?v=3" alt="Let's Code Together Logo">
            <span>Let's Code Together</span>
        </a>
        <ul class="navbar-links">
            <li><a href="index.html">Home / Login</a></li>
            <li><a href="help.html">Help</a></li>
            <li><a href="about.html">About</a></li>
            <li><a href="admin.html" class="navbar-btn-admin">Admin Portal</a></li>
        </ul>
    </header>

    <!-- Center Reset Password Form Card -->
    <main class="reset-page-container">
        <div class="reset-card-wrapper">
            <div class="auth-glass-card">
                
                <div class="reset-card-header">
                    <div class="reset-card-icon">🔑</div>
                    <h1 class="reset-card-title">Reset Your Password</h1>
                    <p class="reset-card-subtitle">Enter your 6-digit OTP verification code and set a new password for your account.</p>
                </div>

                <form id="resetForm">
                    <div class="form-group">
                        <label class="form-label" for="resetOtp">OTP Verification Code</label>
                        <input type="text" id="resetOtp" class="form-input" placeholder="Enter 6-digit OTP" required />
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="newPassword">New Password</label>
                        <div class="password-input-wrap">
                            <input type="password" id="newPassword" class="form-input" placeholder="Enter new strong password" required />
                            <span class="toggle-eye-btn" onclick="togglePassword()" title="Toggle visibility">👁</span>
                        </div>
                    </div>

                    <button type="submit" class="btn-auth-primary" style="margin-top: 8px;">
                        Set New Password & Sign In
                    </button>
                </form>

                <div id="status"></div>

                <a href="index.html" class="back-to-login-link">
                    ← Return to Sign In / Login Page
                </a>
            </div>
        </div>
    </main>

    <script>
        // Toggle password visibility
        function togglePassword() {
            const input = document.getElementById('newPassword');
            const eye   = document.querySelector('.toggle-eye-btn');
            if (input.type === 'password') {
                input.type = 'text';
                eye.textContent = '🙈';
            } else {
                input.type = 'password';
                eye.textContent = '👁';
            }
        }

        // Handle reset
        const urlParams = new URLSearchParams(window.location.search);
        const email = urlParams.get('email');

        if (!email) {
            const statusEl = document.getElementById('status');
            statusEl.textContent = '⚠ Invalid or expired reset link. Please request a new OTP from the login page.';
            statusEl.className = 'error';
            document.getElementById('resetForm').style.display = 'none';
        }

        document.getElementById('resetForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const newPassword = document.getElementById('newPassword').value;
            const otp = document.getElementById('resetOtp').value.trim();
            const statusEl = document.getElementById('status');

            statusEl.textContent = 'Updating password...';
            statusEl.className = '';

            try {
                const response = await fetch('/api/reset-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, otp, newPassword })
                });

                const result = await response.json();
                if (response.ok) {
                    statusEl.textContent = '✓ ' + (result.message || 'Password reset successfully!');
                    statusEl.className = 'success';
                    setTimeout(() => {
                        window.location.href = 'index.html';
                    }, 1800);
                } else {
                    statusEl.textContent = '✗ ' + (result.message || 'Invalid or expired OTP');
                    statusEl.className = 'error';
                }
            } catch (err) {
                statusEl.textContent = '✗ Something went wrong. Please try again.';
                statusEl.className = 'error';
            }
        });
    </script>
</body>
</html>
