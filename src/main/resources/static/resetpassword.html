<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Reset Password</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-size: 16px;
      background: url('backgroundimage.avif') no-repeat center center fixed;
      background-size: cover;
      height: 100vh;
      overflow: hidden;
    }

    /* Dark overlay over background */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background: rgba(2, 8, 20, 0.72);
      z-index: 0;
    }

    .page {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    /* ── NAVBAR ── */
    .navbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px 40px;
      background: rgba(0, 0, 0, 0.25);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
    }

    .navbar img {
      height: 22px;
      border-radius: 6px;
    }

    .nav-links {
      display: flex;
      gap: 8px;
    }

    .nav-links a {
      color: rgba(255, 255, 255, 0.75);
      padding: 8px 16px;
      border-radius: 8px;
      text-decoration: none;
      font-size: 0.95rem;
      font-weight: 500;
      transition: all 0.2s ease;
    }

    .nav-links a:hover {
      color: #ffffff;
      background: rgba(255, 255, 255, 0.1);
    }

    /* ── CENTER CONTENT ── */
    .content {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 24px;
    }

    /* ── FORM CARD ── */
    .form-container {
      background: rgba(8, 15, 34, 0.85);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(0, 245, 160, 0.15);
      border-radius: 20px;
      padding: 44px 40px;
      width: 100%;
      max-width: 420px;
      box-shadow:
        0 0 0 1px rgba(0, 245, 160, 0.06),
        0 24px 64px rgba(0, 0, 0, 0.7),
        0 0 80px rgba(0, 245, 160, 0.05);
      text-align: center;
      color: #e8f0fe;
    }

    /* Lock icon at top */
    .form-container .icon {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      background: rgba(0, 245, 160, 0.1);
      border: 1px solid rgba(0, 245, 160, 0.2);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.2rem;
      margin: 0 auto 20px;
    }

    .form-container h2 {
      font-size: 1.6rem;
      font-weight: 700;
      color: #ffffff;
      margin-bottom: 8px;
    }

    .form-container .subtitle {
      font-size: 0.92rem;
      color: rgba(255, 255, 255, 0.45);
      margin-bottom: 32px;
      line-height: 1.5;
    }

    /* ── INPUT GROUP ── */
    .input-group {
      position: relative;
      margin-bottom: 20px;
      text-align: left;
    }

    .input-group label {
      display: block;
      font-size: 0.82rem;
      font-weight: 600;
      color: rgba(255, 255, 255, 0.5);
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin-bottom: 8px;
    }

    .input-group input {
      width: 100%;
      padding: 14px 16px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      color: #ffffff;
      font-family: inherit;
      font-size: 1rem;
      outline: none;
      transition: border-color 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
    }

    .input-group input::placeholder {
      color: rgba(255, 255, 255, 0.2);
    }

    .input-group input:focus {
      border-color: #00f5a0;
      background: rgba(0, 245, 160, 0.05);
      box-shadow: 0 0 0 3px rgba(0, 245, 160, 0.1);
    }

    /* Show/hide password toggle */
    .input-group .toggle-eye {
      position: absolute;
      right: 14px;
      bottom: 14px;
      cursor: pointer;
      font-size: 1.1rem;
      opacity: 0.4;
      transition: opacity 0.2s;
      user-select: none;
    }

    .input-group .toggle-eye:hover { opacity: 0.9; }

    /* ── SUBMIT BUTTON ── */
    .submit-btn {
      width: 100%;
      padding: 14px;
      margin-top: 8px;
      border: none;
      border-radius: 12px;
      background: #00f5a0;
      color: #020c18;
      font-family: inherit;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 4px 20px rgba(0, 245, 160, 0.3);
      transition: all 0.2s ease;
    }

    .submit-btn:hover {
      background: #22ffb3;
      transform: translateY(-2px);
      box-shadow: 0 8px 32px rgba(0, 245, 160, 0.45);
    }

    .submit-btn:active {
      transform: translateY(0);
    }

    /* ── STATUS MESSAGE ── */
    #status {
      margin-top: 20px;
      font-size: 0.92rem;
      font-weight: 600;
      color: #ff6b6b;
      min-height: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    #status.success {
      color: #00f5a0;
    }

    /* ── BACK LINK ── */
    .back-link {
      display: inline-block;
      margin-top: 24px;
      font-size: 0.9rem;
      color: rgba(255, 255, 255, 0.4);
      text-decoration: none;
      transition: color 0.2s;
    }

    .back-link:hover { color: rgba(255, 255, 255, 0.8); }

    /* ── RESPONSIVE ── */
    @media (max-width: 480px) {
      .navbar { padding: 16px 20px; }
      .form-container { padding: 32px 24px; }
      .form-container h2 { font-size: 1.4rem; }
    }
  </style>
</head>
<body>
  <div class="page">

    <!-- Navbar -->
    <div class="navbar">
      <img src="logo.jpg" alt="Logo">
      <div class="nav-links">
        <a href="index.html">Home</a>
        <a href="about.html">About</a>
        <a href="help.html">Help</a>
      </div>
    </div>

    <!-- Form -->
    <div class="content">
      <div class="form-container">

        <div class="icon">🔒</div>
        <h2>Reset Password</h2>
        <p class="subtitle">Enter your new password below to<br>regain access to your account.</p>

        <form id="resetForm">
          <div class="input-group">
            <label for="newPassword">New Password</label>
            <input type="password" id="newPassword" placeholder="Enter new password" required />
            <span class="toggle-eye" onclick="togglePassword()">👁</span>
          </div>
          <div class="input-group">
            <label for="resetOtp">OTP</label>
            <input type="text" id="resetOtp" placeholder="Enter OTP" required />
          </div>
          <button type="submit" class="submit-btn">Reset Password</button>
        </form>

        <p id="status"></p>
        <a href="index.html" class="back-link">← Back to Home</a>

      </div>
    </div>

  </div>

  <script>
    // Toggle password visibility
    function togglePassword() {
      const input = document.getElementById('newPassword');
      const eye   = document.querySelector('.toggle-eye');
      if (input.type === 'password') {
        input.type = 'text';
        eye.textContent = '🙈';
      } else {
        input.type = 'password';
        eye.textContent = '👁';
      }
    }

    // Handle reset
    const urlParams = new URLSearchParams(window.location.search);
    const email = urlParams.get('email');

    if (!email) {
      const statusEl = document.getElementById('status');
      statusEl.textContent = '⚠ Invalid or expired reset link.';
      document.getElementById('resetForm').style.display = 'none';
    }

    document.getElementById('resetForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const newPassword = document.getElementById('newPassword').value;
      const otp = document.getElementById('resetOtp').value;
      const statusEl    = document.getElementById('status');

      statusEl.textContent = 'Resetting...';
      statusEl.className   = '';

      try {
        const response = await fetch('/api/reset-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, otp, newPassword })
        });

        const result = await response.json();
        statusEl.textContent = response.ok ? '✓ ' + result.message : '✗ ' + result.message;
        statusEl.className   = response.ok ? 'success' : '';
      } catch (err) {
        statusEl.textContent = '✗ Something went wrong. Please try again.';
        statusEl.className   = '';
      }
    });

    // Security
    document.addEventListener('contextmenu', e => e.preventDefault());
    document.addEventListener('selectstart', e => e.preventDefault());
    document.addEventListener('copy',        e => e.preventDefault());
    document.addEventListener('cut',         e => e.preventDefault());
  </script>
</body>
</html>
